[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/flowpilot/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/flowpilot/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
